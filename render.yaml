services:
  - type: web
    name: gplinks-wrapper-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GPLINKS_API_KEY
        sync: false
      - key: API_SECRET
        sync: false
